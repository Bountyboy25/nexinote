<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexinote</title>

    <!-- Installable-app metadata. The manifest itself is generated at
         build time by vite-plugin-pwa (see vite.config.ts) and injected
         here, so it always matches the hashed asset names. -->
    <meta name="description" content="A Milanote-style infinite canvas for visual note-taking. Boards, cards, sketches and connectors, saved locally in your browser." />
    <meta name="theme-color" content="#060b14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Lets iOS run an installed copy without Safari's chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexinote" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--
      This is the ONLY HTML file in the entire app.
      React mounts into this single <div id="root">.
      Everything you see on screen is generated by JavaScript.
      This pattern is called a "Single Page Application" (SPA).
    -->
    <div id="root"></div>

    <!--
      This script tag loads our entire app.
      Vite replaces this with the bundled output in production.
      In dev, it points to the source file directly.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
